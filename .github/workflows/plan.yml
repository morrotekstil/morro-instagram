name: Günlük plan

on:
  schedule:
    - cron: "0 4 * * *"   # her gün 07:00 (Türkiye)
  workflow_dispatch:
    inputs:
      deneme:
        description: "Deneme modu (token yenilemez)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: morro-depo
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.46.3 numpy scipy
      - name: Plan oluştur
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TRENDYOL_SELLER_ID: ${{ secrets.TRENDYOL_SELLER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          DRY_RUN: ${{ inputs.deneme && '1' || '0' }}
        run: python plan.py
      - name: Kaydet
        run: |
          git config user.name "morro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "Plan $(TZ=Europe/Istanbul date +%F)"
          git pull --rebase && git push
