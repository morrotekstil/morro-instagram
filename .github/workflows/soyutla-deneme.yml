name: Manken soyutlama denemesi

on:
  workflow_dispatch:
    inputs:
      adet:
        description: "Kaç ürün denensin"
        default: "6"

permissions:
  contents: write

concurrency:
  group: morro-depo
  cancel-in-progress: false

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.46.3 numpy
      - name: Soyutla
        env:
          TRENDYOL_SELLER_ID: ${{ secrets.TRENDYOL_SELLER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
        run: python soyutla_deneme.py ${{ inputs.adet }}
      - name: Kaydet
        run: |
          git config user.name "morro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A deneme
          git diff --cached --quiet || git commit -m "Soyutlama denemesi"
          git pull --rebase && git push
